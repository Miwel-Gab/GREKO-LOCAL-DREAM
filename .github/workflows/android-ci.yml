name: GREKO-LOCAL-DREAM Android CI

on:
  workflow_dispatch:
  push:
    branches: [master, "greko/**"]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".gitmodules"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Android variants
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout source and native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 --install "platforms;android-37.0" "platform-tools" "build-tools;37.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
          sudo apt-get update
          sudo apt-get install -y ninja-build
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Download and verify Qualcomm AI Runtime SDK
        shell: bash
        env:
          QNN_SDK_URL: https://softwarecenter.qualcomm.com/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/2.51.0.260929/v2.51.0.260929.zip
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/qnn-2.51.0.260929.zip"
          sdk_dir="$RUNNER_TEMP/qnn-sdk"
          mkdir -p "$sdk_dir"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 "$QNN_SDK_URL" -o "$archive"
          unzip -t "$archive"
          unzip -q "$archive" -d "$sdk_dir"
          qnn_root="$sdk_dir/qairt/2.51.0.260929"
          test -d "$qnn_root/examples/QNN/SampleApp/SampleApp"
          test -f "$qnn_root/lib/aarch64-android/libQnnHtp.so"
          test -f "$qnn_root/lib/aarch64-android/libQnnSystem.so"
          echo "QNN_SDK_ROOT=$qnn_root" >> "$GITHUB_ENV"

      - name: Install Rust Android target
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android
          rustc --print target-libdir --target aarch64-linux-android

      - name: Build native Stable Diffusion backend
        shell: bash
        run: |
          set -euo pipefail
          cd app/src/main/cpp
          bash build.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests and assemble APKs
        run: ./gradlew --no-daemon --stacktrace testBasicDebugUnitTest assembleBasicDebug assembleFilterDebug

      - name: Verify APK outputs and native backend
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk -type f -name '*.apk' | sort)
          test "${#apks[@]}" -ge 2
          for apk in "${apks[@]}"; do
            echo "Checking native backend in: $apk"
            unzip -Z1 "$apk" | grep -Fx 'lib/arm64-v8a/libstable_diffusion_core.so'
            unzip -Z1 "$apk" | grep -Eq '^assets/qnnlibs/libQnnHtp.*\.so$'
            unzip -Z1 "$apk" | grep -Fx 'assets/qnnlibs/libQnnSystem.so'
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GREKO-LOCAL-DREAM-debug-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
