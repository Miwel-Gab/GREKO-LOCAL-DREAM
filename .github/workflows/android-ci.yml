name: GREKO-LOCAL-DREAM Android CI

on:
  workflow_dispatch:
  push:
    branches: [master, "greko/**"]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".gitmodules"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Android variants
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout source and native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests and assemble APKs
        run: ./gradlew --no-daemon --stacktrace testBasicDebugUnitTest assembleBasicDebug assembleFilterDebug

      - name: Verify APK outputs
        shell: bash
        run: |
          set -euo pipefail
          find app/build/outputs/apk -type f -name '*.apk' -print
          test "$(find app/build/outputs/apk -type f -name '*.apk' | wc -l)" -ge 2

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GREKO-LOCAL-DREAM-debug-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
